<div class="order-list">{% for order in orders %}<a class="order-list-item" href="/orders/{{ order.id }}"><span class="order-list-number">№ {{ (order.id|string)[:8] }}</span><span class="muted">{{ order.created_at.strftime('%d.%m.%Y') }}</span><span class="status-tag">{{ order.status }}</span><strong>{{ '%.2f'|format(order.total) }} ₽</strong><span class="order-next">↗</span></a>{% else %}<div class="empty"><strong>Заказов ещё нет</strong><p>Когда оформите заказ, он появится здесь.</p><a class="btn secondary" href="/catalog">Перейти к каталогу</a></div>{% endfor %}</div>
