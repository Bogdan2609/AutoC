[project]
name = "autoparts-platform-v2"
version = "0.33.2"
description = "Modular monolith for an autoparts catalog and supplier offers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings>=2.11,<3",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "argon2-cffi>=25,<26",
    "email-validator>=2.2,<3",
    "defusedxml>=0.7,<1",
    "redis>=6,<8",
    "zeep[async]==4.3.3",
    "packaging>=24,<27",
    "pillow>=12.0,<13",
    "pypdf>=5.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10", "pytest-asyncio>=1.2,<2", "aiosqlite>=0.21,<1", "ruff>=0.17,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
